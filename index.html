<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NÚCLEO ACCIONABLE: DEEP PLASMA GENERATOR</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040608;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .control-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            background: rgba(7, 11, 16, 0.92);
            border: 2px solid #00ffcc;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.4);
            width: 90%;
            max-width: 390px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        .control-panel.oculto {
            opacity: 0;
            transform: translate(-50%, -55%) scale(0.85);
            pointer-events: none;
        }
        h2 {
            color: #00ffcc;
            margin: 0 0 10px 0;
            font-size: 18px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }
        button {
            background: #00ffcc;
            color: #040608;
            border: none;
            padding: 16px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.3);
            transition: all 0.2s;
        }
        button:active {
            background: #fff;
            box-shadow: 0 0 25px #fff;
        }
        .slider-box {
            margin: 25px 0 10px 0;
            text-align: left;
        }
        label {
            color: #88a0a8;
            font-size: 11px;
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #111822;
            outline: none;
            border: 1px solid #00ffcc;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #00ffcc;
            cursor: pointer;
            box-shadow: 0 0 12px #00ffcc;
        }
        .btn-menu-flotante {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 100;
            background: rgba(7, 11, 16, 0.8);
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
        }
    </style>
</head>
<body>

<canvas id="plasmaCanvas"></canvas>
<button class="btn-menu-flotante" id="btnMenu" onclick="restaurarMenu()">⚙️ MODIFICAR FRECUENCIA</button>

<div class="control-panel" id="controlPanel">
    <h2>NÚCLEO DE INVERSIÓN FÍSICA</h2>
    <p style="color: #88a0a8; font-size: 11px; margin: 0 0 20px 0;">Control háptico y cromático continuo en la red</p>
    
    <button id="btnActivar">INICIALIZAR SISTEMA</button>
    
    <div class="slider-box" id="sliderContainer" style="display: none;">
        <label id="vibracionLabel">MODULACIÓN DE ONDA ACÚSTICA: 75 Hz</label>
        <input type="range" id="vibracionSlider" class="range-slider" min="1" max="150" value="75">
    </div>
</div>

<script>
    const canvas = document.getElementById('plasmaCanvas');
    const ctx = canvas.getContext('2d');
    const panel = document.getElementById('controlPanel');
    const slider = document.getElementById('vibracionSlider');
    const label = document.getElementById('vibracionLabel');
    const btnMenu = document.getElementById('btnMenu');
    
    let audioCtx = null;
    let osciladorPrimario = null;
    let osciladorModulador = null;
    let nodoGanancia = null;
    
    let ejecutando = false;
    let factorVibracion = 75;
    let cicloTiempo = 0;

    function reajustarDimensiones() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', reajustarDimensiones);
    reajustarDimensiones();

    // RENDERIZADOR CUÁNTICO: Genera la matriz de plasma líquido fluido
    function buclePlasma() {
        if (!ejecutando) return;

        const ancho = canvas.width;
        const alto = canvas.height;
        
        // Factor de compresión interna para evitar congelamientos en iOS/Android
        const resolucion = 4; 
        const w = Math.ceil(ancho / resolucion);
        const h = Math.ceil(alto / resolucion);
        
        const buffer = ctx.createImageData(w, h);
        const pixeles = buffer.data;

        // La velocidad de transmutación depende directamente del slider
        cicloTiempo += 0.025 * (factorVibracion * 0.05 + 1);

        for (let y = 0; y < h; y++) {
            for (let x = 0; x < w; x++) {
                const cx = x / w - 0.5;
                const cy = y / h - 0.5;

                // Ecuaciones de oscilación de plasma por ondas combinadas
                let o1 = Math.sin(cx * 7 + cicloTiempo);
                let o2 = Math.sin(10 * (cx * Math.sin(cicloTiempo / 2) + cy * Math.cos(cicloTiempo / 3)) + cicloTiempo);
                let dist_x = cx + 0.5 * Math.sin(cicloTiempo / 5);
                let dist_y = cy + 0.5 * Math.cos(cicloTiempo / 4);
                let o3 = Math.sin(Math.sqrt(140 * (dist_x * dist_x + dist_y * dist_y) + 1) - cicloTiempo);
                
                let plasmaTotal = o1 + o2 + o3;

                // Generación de espectro cromático reactivo al slider
                const r = Math.floor(Math.sin(plasmaTotal * Math.PI) * 127 + 128);
                const g = Math.floor(Math.sin(plasmaTotal * Math.PI + (2 * Math.PI / 3)) * 127 + 128);
                const b = Math.floor(Math.sin(plasmaTotal * Math.PI + (4 * Math.PI / 3)) * 127 + 128);

                const offset = (x + y * w) * 4;
                
                // Distribución energética de colores controlada por la vibración
                pixeles[offset]     = Math.floor(r * (factorVibracion / 150)); 
                pixeles[offset + 1] = Math.floor(g * (1 - (factorVibracion / 250)));                                      
                pixeles[offset + 2] = Math.floor(b * (1 - factorVibracion / 150)); 
                pixeles[offset + 3] = 255; // Opacidad total                                    
            }
        }

        // Proyectar el cálculo de datos a pantalla completa de forma nativa
        const canvasFiltro = document.createElement('canvas');
        canvasFiltro.width = w;
        canvasFiltro.height = h;
        canvasFiltro.getContext('2d').putImageData(buffer, 0, 0);
        ctx.drawImage(canvasFiltro, 0, 0, ancho, alto);

        // MODULACIÓN ACÚSTICA REAL: Cambia el zumbido infinito mientras arrastras el control
        if (osciladorPrimario && audioCtx) {
            const frecuenciaCalculada = 50 + (factorVibracion * 2.8);
            const microModulacion = Math.sin(cicloTiempo * 1.5) * (factorVibracion * 0.3);
            osciladorPrimario.frequency.setValueAtTime(frecuenciaCalculada + microModulacion, audioCtx.currentTime);
        }

        requestAnimationFrame(buclePlasma);
    }

    // Monitoreo dinámico del slider táctil
    slider.addEventListener('input', function() {
        factorVibracion = parseFloat(this.value);
        label.innerText = `MODULACIÓN DE ONDA ACÚSTICA: ${Math.floor(factorVibracion * 2)} Hz`;
        
        // Forzar micro-vibración háptica física continua (Soportado en Android)
        if (navigator.vibrate) {
            navigator.vibrate(15);
        }
    });

    function restaurarMenu() {
        panel.classList.remove('oculto');
        btnMenu.style.display = "none";
    }

    // DISPARADOR MAESTRO (Salto seguro de las restricciones de iOS/Android/Windows)
    document.getElementById('btnActivar').addEventListener('click', function() {
        ejecutando = true;
        
        // 1. FORZADO INTEGRAL DE PANTALLA COMPLETA NATIVA
        try {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) { /* Motor WebKit - iOS/Safari */
                document.documentElement.webkitRequestFullscreen();
            }
        } catch (e) { console.log("Permisos de pantalla completa restringidos por el hardware."); }

        // 2. APERTURA DE SOCKETS DE AUDIO INFINITO (Inmune a bloqueos por interacción previa)
        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!osciladorPrimario) {
        // MODULACIÓN ACÚSTICA REAL: Cambia el zumbido infinito mientras arrastras el control
        if (osciladorPrimario && audioCtx) {
            const frecuenciaCalculada = 50 + (factorVibracion * 2.8);
            const microModulacion = Math.sin(cicloTiempo * 1.5) * (factorVibracion * 0.3);
            osciladorPrimario.frequency.setValueAtTime(frecuenciaCalculada + microModulacion, audioCtx.currentTime);
        }

        requestAnimationFrame(buclePlasma);
    }

    // Monitoreo dinámico del slider táctil
    slider.addEventListener('input', function() {
        factorVibracion = parseFloat(this.value);
        label.innerText = `MODULACIÓN DE ONDA ACÚSTICA: ${Math.floor(factorVibracion * 2)} Hz`;
        
        if (navigator.vibrate) {
            navigator.vibrate(15);
        }
    });

    function restaurarMenu() {
        panel.classList.remove('oculto');
        btnMenu.style.display = "none";
    }

    // DISPARADOR MAESTRO
    document.getElementById('btnActivar').addEventListener('click', function() {
        ejecutando = true;
        
        try {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        } catch (e) { console.log("Pantalla completa restringida."); }

        try {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!osciladorPrimario) {
                nodoGanancia = audioCtx.createGain();
                osciladorPrimario = audioCtx.createOscillator();
                osciladorModulador = audioCtx.createOscillator();

                osciladorPrimario.type = 'triangle'; 
                osciladorPrimario.frequency.setValueAtTime(50 + (factorVibracion * 2.8), audioCtx.currentTime);

                osciladorModulador.type = 'sawtooth';
                osciladorModulador.frequency.setValueAtTime(3 + (factorVibracion * 0.04), audioCtx.currentTime);

                nodoGanancia.gain.setValueAtTime(0.22, audioCtx.currentTime);

                osciladorModulador.connect(nodoGanancia.gain);
                osciladorPrimario.connect(nodoGanancia);
                nodoGanancia.connect(audioCtx.destination);

                osciladorPrimario.start();
                osciladorModulador.start();
            }
        } catch (error) { console.log("Hardware de audio no disponible."); }

        document.getElementById('btnActivar').style.display = "none";
        document.getElementById('sliderContainer').style.display = "block";
        
        setTimeout(() => {
            panel.classList.add('oculto');
            btnMenu.style.display = "block";
        }, 1000);

        buclePlasma();
    });
</script>
</body>
</html>
